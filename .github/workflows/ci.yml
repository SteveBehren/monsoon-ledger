name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm run setup

      - name: Test scripts
        run: npm test

      - name: Validate data
        run: npm run validate

      - name: Build site
        run: npm run build
