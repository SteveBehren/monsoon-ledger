- date: 2026-10-27
  kind: feature
  title_en: Analysis 01, "Nobody to Call", published
  title_id: Analisis 01, "Tak Ada yang Bisa Dihubungi", diterbitkan
  detail_en: >
    The first analysis paper, with numbered references, a figure and promise table computed from the ledger, citation formats,
    a Word download, Scholar metadata and a draft Bahasa Indonesia translation of its key sections. Before publication its claims
    were checked against sources: quotes were shortened or cut to one per source, the California and New York rows, the Hugging
    Face disclosure date and the wiki's name were corrected, and eleven primary sources were added. A wrong reading of 17 October
    2024 as the deadline for the data protection institution was corrected on the Instruments and Method pages. Could not be
    verified: the official text of GR 33/2026, and the population figure in the paper's "Why Indonesia" paragraph, which is marked
    for the author. Archive copies of the new sources could not be made from the build environment; the scheduled scan will try.
  detail_id: >
    Makalah analisis pertama, dengan rujukan bernomor, gambar dan tabel janji yang dihitung dari catatan janji, format kutipan,
    unduhan Word, metadata Scholar, dan terjemahan draf bahasa Indonesia untuk bagian-bagian utamanya. Sebelum terbit, klaimnya
    diperiksa terhadap sumber: kutipan dipersingkat atau dikurangi menjadi satu per sumber, baris California dan New York, tanggal
    pengungkapan Hugging Face, dan nama wiki dikoreksi, serta sebelas sumber primer ditambahkan. Tafsir keliru bahwa 17 Oktober
    2024 adalah tenggat pembentukan lembaga pelindungan data dikoreksi di halaman Instrumen dan Metode. Yang belum bisa
    diverifikasi: naskah resmi PP 33/2026, dan angka penduduk di paragraf "Why Indonesia" dalam makalah, yang ditandai untuk
    penulis. Salinan arsip sumber baru belum bisa dibuat dari lingkungan pembangunan; pemindaian terjadwal akan mencobanya.
  pr: 7
  commits: ["325339f"]

- date: 2026-10-25
  kind: feature
  title_en: Computed promise outcomes, receipts, the open promise format and evidence archiving
  title_id: Hasil janji yang dihitung, bukti janji, format janji terbuka, dan pengarsipan bukti
  detail_en: >
    Promise outcomes are now computed from deadlines derived by published rules, so headline counts read among dated promises
    (4 of 5 missed) with conditional and status claims shown apart, instead of 4 of 7 set by hand. Every promise has a receipt
    page and share card. The format is published with a JSON Schema the validator uses, worked examples and a kit for other
    countries. Sources get preserved copies in the Internet Archive after each scan. The weather map and the running clock,
    which repeated the same seven deadlines, were removed. A GDPR fine tier in the breach entry was corrected.
  detail_id: >
    Hasil janji kini dihitung dari tenggat yang diturunkan dengan aturan yang diterbitkan, jadi angka utama dihitung dari janji
    bertenggat (4 dari 5 terlewat) dengan janji bersyarat dan klaim kemajuan ditampilkan terpisah, bukan 4 dari 7 yang diisi
    manual. Setiap janji punya halaman bukti janji dan kartu pratinjau. Formatnya diterbitkan bersama JSON Schema yang dipakai
    validator, contoh nyata, dan kit untuk negara lain. Sumber disimpan salinannya di Internet Archive setelah setiap pemindaian.
    Peta cuaca dan jam berjalan, yang mengulang tujuh tenggat yang sama, dihapus. Satu tingkat denda GDPR di catatan kebocoran
    data dikoreksi.
  pr: 6
  commits: ["b786b78", "55e8dce", "12a131a", "314162f", "e15b19f"]

