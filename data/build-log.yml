# Build log: every change the author asked for, newest first, shown under "Build so far" on the
# Technical system page. Every update gets a row, including fixes, reverts and rollbacks.
#
# kind:     feature | fix | content | revert | rollback
# pr:       the pull request number, once it exists
# commits:  short hashes of the commits that did the work (merge commits left out), in quotes
#           so YAML never reads a hash such as 4518e71 as a number
# Rows are checked by npm run validate: real dates, newest first, known kind, short hashes.

- date: 2026-10-23
  kind: feature
  title_en: Visual layer, ontology, About abstract, icons and link previews
  title_id: Lapisan visual, ontologi, abstrak Tentang, ikon, dan pratinjau tautan
  detail_en: >
    A live weather map on the home page whose markers are the seven public deadlines, a running clock since the first promise,
    a replay slider on Promise vs Reality, charts on Entries and Radar, a reading rail on long pages and motion across the site.
    An ontology layer joins entries, instruments, promises, officials, institutions and documents, with a graph explorer and a
    JSON export. The About page became a research abstract, with the author's background taken from the CV and diploma the
    author shared (professional facts only, the files are not published). New icons and preview cards so links show a proper card in chat apps.
    The tagline now reads "promises checked against the record". This build log replaced the hand-written timeline.
  detail_id: >
    Peta cuaca hidup di beranda dengan penanda untuk tujuh tenggat publik, jam berjalan sejak janji pertama, penggeser putar ulang
    di Janji vs Kenyataan, grafik di Catatan dan Radar, panel baca di halaman panjang, dan gerak di seluruh situs. Lapisan ontologi
    menghubungkan catatan, instrumen, janji, pejabat, lembaga, dan dokumen, lengkap dengan penjelajah grafik dan ekspor JSON.
    Halaman Tentang menjadi abstrak riset, dengan latar belakang penulis dari CV dan ijazah yang dibagikan penulis (hanya fakta
    profesional, berkasnya tidak diterbitkan). Ikon dan kartu pratinjau baru agar tautan tampil rapi di aplikasi obrolan. Slogan kini
    berbunyi "janji dicocokkan dengan catatan". Log pembangunan ini menggantikan linimasa yang ditulis manual.
  commits: ["dd028b3", "6135efb", "b7f7fd4", "4d8ec6d"]

- date: 2026-10-23
  kind: fix
  title_en: Scanner scoring tightened after the first live run
  title_id: Penilaian pemindai diperketat setelah uji langsung pertama
  detail_en: >
    The first live run let through headlines that only named an institution, tagged some leads with the wrong country and
    repeated stories already in the ledger. Core terms, country hints and slug matching fixed all three.
  detail_id: >
    Uji langsung pertama meloloskan judul yang hanya menyebut nama lembaga, memberi negara yang salah pada sebagian petunjuk, dan
    mengulang berita yang sudah ada di catatan. Istilah inti, petunjuk negara, dan pencocokan slug memperbaiki ketiganya.
  pr: 4
  commits: ["91c6855"]

- date: 2026-10-23
  kind: feature
  title_en: Monitoring layer, the Radar and the Technical system page
  title_id: Lapisan pemantauan, Radar, dan halaman Sistem teknis
  detail_en: >
    A scanner that reads watched sources twice a week and lists unreviewed leads on a new Radar page, with tests, a scheduled
    workflow and this page documenting the whole system. Duplicate tables and repeated headings were removed.
  detail_id: >
    Pemindai yang membaca sumber pantauan dua kali seminggu dan mencantumkan petunjuk yang belum ditinjau di halaman Radar baru,
    lengkap dengan pengujian, alur kerja terjadwal, dan halaman ini yang mendokumentasikan seluruh sistem. Tabel ganda dan judul
    berulang dihapus.
  pr: 4
  commits: ["95c8430"]

