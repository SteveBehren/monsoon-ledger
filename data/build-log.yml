# Build log: every change the author asked for, newest first, shown under "Build so far" on the
# Technical system page. Every update gets a row, including fixes, reverts and rollbacks.
#
# kind:     feature | fix | content | revert | rollback
# pr:       the pull request number, once it exists
# commits:  short hashes of the commits that did the work (merge commits left out), in quotes
#           so YAML never reads a hash such as 4518e71 as a number
# Rows are checked by npm run validate: real dates, newest first, known kind, short hashes.

- date: 2026-10-27
  kind: feature
  title_en: The ontology explorer becomes a three-layer console
  title_id: Penjelajah ontologi menjadi konsol tiga lapisan
  detail_en: >
    The force-directed graph reshuffled after every scan and turned into a tangle with every object type switched on, because
    62 source documents made up half of it. It is replaced by one window with three tabs. Semantic puts objects in fixed lanes in
    a stable order, groups documents, outlets and references until a selection needs them, and draws only the links around the
    selected object. Kinetic puts every dated event on one time axis with an event log. Dynamic lists what needs attention on
    the build day, computed from the data with no forecasts. All three share one inspector, and the window can go full screen.
    Phones get folding lanes and a bottom sheet. Fixed in testing: a class name clash flattened the window bar, the inspector
    covered the search and full screen buttons, Escape stopped working after Back, and search missed short names such as GDPR.
  detail_id: >
    Grafik berbasis gaya sebelumnya teracak ulang setiap kali pemindaian selesai dan menjadi kusut bila semua tipe objek
    dinyalakan, karena 62 dokumen sumber mengisi separuhnya. Penggantinya adalah satu jendela dengan tiga tab. Semantik
    menempatkan objek di lajur tetap dengan urutan yang stabil, mengelompokkan dokumen, media, dan rujukan sampai sebuah pilihan
    membutuhkannya, dan hanya menggambar tautan di sekitar objek yang dipilih. Kinetik menaruh setiap peristiwa bertanggal pada
    satu sumbu waktu beserta log peristiwa. Dinamis mencantumkan apa yang perlu diperhatikan pada hari situs dibangun, dihitung
    dari data tanpa ramalan. Ketiganya memakai satu panel pemeriksa yang sama, dan jendelanya bisa dibuka layar penuh. Di ponsel,
    lajur bisa dilipat dan panel pemeriksa muncul dari bawah. Diperbaiki saat pengujian: nama kelas yang bentrok membuat bilah
    jendela gepeng, panel pemeriksa menutupi tombol cari dan layar penuh, tombol Escape tidak berfungsi setelah Kembali, dan
    pencarian tidak menemukan nama pendek seperti GDPR.
  pr: 8
  commits: ["7f425cf"]

- date: 2026-10-27
  kind: content
  title_en: README, Technical system page and working rules updated for the new layers
  title_id: README, halaman Sistem teknis, dan aturan kerja diperbarui untuk lapisan baru
  detail_en: >
    The README now lists the new pages, how analysis papers, the quote check, the incident reference and the reading list work,
    the quality gates and the project layout. The Technical system page describes the new data models and checks. The working
    rules in CLAUDE.md cover the lens, incidents, reading and quotes. The README paragraph on how AI is used carries a note for
    the author to confirm, because Claude drafted two entries and the Bahasa Indonesia translation this round.
  detail_id: >
    README kini memuat halaman baru, cara kerja makalah analisis, pemeriksaan kutipan, rujukan insiden, dan daftar bacaan, gerbang
    mutu, serta susunan proyek. Halaman Sistem teknis menjelaskan model data dan pemeriksaan yang baru. Aturan kerja di CLAUDE.md
    mencakup lensa, insiden, bacaan, dan kutipan. Paragraf README tentang penggunaan AI diberi catatan untuk dikonfirmasi penulis,
    karena Claude menyusun draf dua catatan dan terjemahan bahasa Indonesia pada putaran ini.
  pr: 7
  commits: ["a7caace"]

- date: 2026-10-27
  kind: feature
  title_en: Language parity check, internal link check and accessibility fixes
  title_id: Pemeriksaan kesetaraan bahasa, pemeriksaan tautan internal, dan perbaikan aksesibilitas
  detail_en: >
    The build now fails if a page exists in only one language, unless it is marked partial, or if a data field has English text
    without its Bahasa Indonesia twin. A new offline check confirms every internal link and anchor in the built site. The
    automated accessibility check found no contrast or label problems on the new pages. Fixed in testing: a hidden data table
    made the paper page 722 pixels wide on phones, the menu bar crowded at 1280 pixels with eight items, and two landmark
    warnings. External links could not be checked from the build environment, which blocks those sites.
  detail_id: >
    Pembangunan situs kini gagal bila sebuah halaman hanya ada dalam satu bahasa, kecuali ditandai sebagian, atau bila kolom data
    berbahasa Inggris tidak punya padanan bahasa Indonesia. Pemeriksaan baru tanpa jaringan memastikan setiap tautan dan jangkar
    internal di situs berfungsi. Pemeriksaan aksesibilitas otomatis tidak menemukan masalah kontras atau label di halaman baru.
    Yang diperbaiki saat pengujian: tabel data tersembunyi membuat halaman makalah selebar 722 piksel di ponsel, bilah menu
    terlalu sesak pada lebar 1280 piksel dengan delapan item, dan dua peringatan landmark. Tautan eksternal tidak bisa diperiksa
    dari lingkungan pembangunan, yang memblokir situs-situs itu.
  pr: 7
  commits: ["fd75cf0"]

