- date: 2026-10-22
  kind: fix
  title_en: Redesign restored after a deploy from an older branch
  title_id: Desain baru dipulihkan setelah penerbitan dari cabang lama
  detail_en: >
    A production deploy was made from a branch cut before the redesign, so the live site showed the old design. The redesign was
    merged back in, the legal brief was ported onto it, and the site was deployed again. The lesson: check main before every deploy.
  detail_id: >
    Situs produksi sempat diterbitkan dari cabang yang dibuat sebelum desain ulang, sehingga situs menampilkan desain lama. Desain
    baru digabungkan kembali, catatan hukum dipindahkan ke desain itu, lalu situs diterbitkan ulang. Pelajarannya: cek main
    sebelum setiap penerbitan.
  pr: 3
  commits: ["e01a8a7"]

