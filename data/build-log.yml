- date: 2026-10-27
  kind: feature
  title_en: Frontier incident reference
  title_id: Rujukan insiden AI garda depan
  detail_en: >
    Four public reports of frontier AI models or agents acting on, or used against, systems outside the developer's control,
    with dates only as sources give them and day counts computed in code. Analysis 01 now reads its 84 and 30 day counts from
    this data, and the build fails if they drift. Several dates are not given by any source read, among them when OpenAI became
    aware of the Hugging Face and wiki activity and when the Commission received OpenAI's report; they are left empty.
  detail_id: >
    Empat laporan publik tentang model atau agen AI garda depan yang bertindak di, atau dipakai menyerang, sistem di luar kendali
    pengembangnya, dengan tanggal hanya sesuai sumber dan jumlah hari dihitung oleh kode. Analisis 01 kini membaca angka 84 dan
    30 hari dari data ini, dan pembangunan gagal bila angkanya bergeser. Beberapa tanggal tidak disebut sumber mana pun yang
    dibaca, antara lain kapan OpenAI mengetahui aktivitas di Hugging Face dan wiki, serta kapan Komisi menerima laporan OpenAI;
    tanggal itu dibiarkan kosong.
  pr: 7
  commits: ["ed1bec7"]

- date: 2026-10-27
  kind: feature
  title_en: Safety lens v2 and two entries from published texts
  title_id: Lensa keselamatan v2 dan dua catatan dari naskah yang diterbitkan
  detail_en: >
    Three new lens questions on every entry: who receives incident reports and whether that body exists, cross-border scope and
    frontier scope. Every coded value now names its source, and a "no" can no longer come from a press report. The roadmap
    entry's enforcement value went from "none" to "unclear" because no source states it. New entries for Circular Letter 9/2023
    and the ASEAN generative AI guide, without the author's take. New Safety lens page.
  detail_id: >
    Tiga pertanyaan lensa baru untuk setiap catatan: siapa penerima laporan insiden dan apakah badan itu ada, cakupan lintas batas,
    dan cakupan AI garda depan. Setiap nilai yang dikodekan kini menyebut sumbernya, dan nilai tidak tidak boleh lagi diambil dari
    berita. Nilai penegakan pada catatan peta jalan berubah dari tidak ada menjadi belum jelas karena tidak ada sumber yang
    menyatakannya. Catatan baru untuk Surat Edaran 9/2023 dan panduan AI generatif ASEAN, tanpa pendapat penulis. Halaman baru
    Lensa keselamatan.
  pr: 7
  commits: ["4e5200d"]

