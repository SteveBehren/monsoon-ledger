# Janji vs Kenyataan: every public promise about Indonesia's AI rules, newest first.
#
# Each row follows the promise format in docs/standard/v0.1/ and is checked against
# docs/standard/v0.1/promise.schema.json by npm run validate.
#
# The outcome (met, missed, open, no deadline) is never written here. scripts/promises.mjs
# computes it from claim_type, deadline and outcome_date, so it changes on its own when a
# deadline passes. When something happens, set outcome_date and outcome_source_url, update
# outcome_en and outcome_id, and add a dated line to CHANGELOG.md.
#
# claim_type: dated (has a deadline) | conditional (depends on an event) | status_claim (progress, no deadline)
# deadline_rule: within N months | within N days | end YYYY-MM | end YYYY-Qn | end YYYY-Hn | end YYYY | on YYYY-MM-DD
# The validator checks that deadline and deadline_precision follow from deadline_rule and date_said.
# Where the wording allows more than one reading, the latest plausible deadline is used.

- date_said: 2026-10-21
  country: ID
  who: Irma Handayani, Komdigi
  # TODO: add role_en and role_id once the role is confirmed in this row's source.
  claim_type: conditional
  deadline_basis_en: The task force is to start once the President signs the regulations. No date is given, so this promise has no deadline and cannot be missed.
  deadline_basis_id: Gugus tugas mulai bekerja setelah Presiden menandatangani aturannya. Tidak ada tanggal, jadi janji ini tidak punya tenggat dan tidak bisa terlewat.
  promised_en: Task force starts once the President signs
  promised_id: Gugus tugas mulai bekerja setelah Presiden menandatangani
  outcome_en: Still called a draft
  outcome_id: Masih disebut rancangan
  evidence: official-statement
  source_url: https://www.antaranews.com/berita/5802305/pemerintah-siapkan-gugus-tugas-kawal-implementasi-regulasi-ai

- date_said: 2026-09-03
  country: ID
  who: Edwin Hidayat Abdullah, Komdigi
  role_en: Director General of Digital Ecosystem, Komdigi
  role_id: Direktur Jenderal Ekosistem Digital, Komdigi
  claim_type: status_claim
  deadline_basis_en: A claim about progress, that only the President's signature was left. It sets no deadline of its own.
  deadline_basis_id: Klaim tentang kemajuan, bahwa tinggal tanda tangan Presiden. Klaim ini tidak menetapkan tenggat.
  promised_en: Only the President's signature left
  promised_id: Tinggal menunggu tanda tangan Presiden
  outcome_en: Not signed seven weeks later
  outcome_id: Tujuh minggu kemudian belum ditandatangani
  evidence: official-statement
  source_url: https://selular.id/2026/09/dua-perpres-ai-tunggu-tanda-tangan-presiden-prabowo/

- date_said: 2026-01-26
  country: ID
  who: Meutya Hafid, Minister
  role_en: Minister of Communication and Digital Affairs
  role_id: Menteri Komunikasi dan Digital
  claim_type: dated
  deadline_rule: end 2026
  deadline: 2026-12-31
  deadline_precision: year
  deadline_basis_en: Called a priority to sign in 2026, so the last day of 2026. The headline speaks of early this year; the later reading is used so that a miss can always be defended.
  deadline_basis_id: Disebut prioritas untuk ditandatangani pada 2026, jadi hari terakhir 2026. Judul beritanya menyebut awal tahun ini; tafsir yang paling akhir dipakai supaya setiap status terlewat selalu bisa dipertanggungjawabkan.
  promised_en: A priority to sign in 2026
  promised_id: Prioritas untuk ditandatangani pada 2026
  outcome_en: Still a draft as of 21 October 2026
  outcome_id: Masih rancangan per 21 Oktober 2026
  evidence: official-statement
  source_url: https://www.cnnindonesia.com/teknologi/20260126203143-185-1321329/menkomdigi-sebut-perpres-ai-segera-disahkan-presiden-awal-tahun-ini

