id: 2026-06-17-id-report-all-incidents
date: 2026-06-17
country: ID
instrument: draft-perpres-ai-ethics
status: draft
evidence: official-statement

title_en: Report everything, not just high risk
title_id: Laporkan semuanya, bukan hanya yang berisiko tinggi

summary_en: >
  In a consultation on the draft, the US-ASEAN Business Council, the US Chamber of Commerce and US
  tech providers asked Indonesia to require incident reports only for high-risk AI. Komdigi refused
  and kept reporting for all incidents.

ringkasan_id: >
  Dalam konsultasi atas rancangan, US-ASEAN Business Council, US Chamber of Commerce, dan penyedia
  teknologi AS meminta Indonesia mewajibkan laporan insiden hanya untuk AI berisiko tinggi.
  Komdigi menolak dan tetap mewajibkan pelaporan semua insiden.

quote:
  original: "Semua dilaporkan, karena (insiden) yang kecil-kecil pun kalau dibiarkan dia akan jadi besar."
  en: "Everything gets reported, because even small incidents grow big if left alone."
  source_url: https://www.antaranews.com/berita/5612117/kemkomdigi-jelaskan-isi-konsultasi-dengan-as-soal-rancangan-perpres-ai
