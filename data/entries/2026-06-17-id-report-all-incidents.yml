id: 2026-06-17-id-report-all-incidents
date: 2026-06-17
country: ID
instrument: draft-perpres-ai-ethics
status: draft
evidence: official-statement

title_en: Report everything, not just high risk
title_id: Laporkan semuanya, bukan hanya yang berisiko tinggi

summary_en: >
  In a consultation on the draft, the US-ASEAN Business Council, the US Chamber of Commerce and US
  tech providers asked Indonesia to require incident reports only for high-risk AI. Komdigi refused
  and kept reporting for all incidents.

ringkasan_id: >
  Dalam konsultasi atas rancangan, US-ASEAN Business Council, US Chamber of Commerce, dan penyedia
  teknologi AS meminta Indonesia mewajibkan laporan insiden hanya untuk AI berisiko tinggi.
  Komdigi menolak dan tetap mewajibkan pelaporan semua insiden.

quote:
  original: "Semua dilaporkan, karena (insiden) yang kecil-kecil pun kalau dibiarkan dia akan jadi besar."
  en: "Everything gets reported, because even small incidents grow big if left alone."
  source_url: https://www.antaranews.com/berita/5612117/kemkomdigi-jelaskan-isi-konsultasi-dengan-as-soal-rancangan-perpres-ai
  attribution_en: Aju Widyasari, Director of Artificial Intelligence and New Technology Ecosystems (AIKITA), Komdigi
  attribution_id: Aju Widyasari, Direktur Kecerdasan Artifisial dan Ekosistem Teknologi Baru (AIKITA) Kemkomdigi

safety_lens:
  incident_reporting: "yes"
  unacceptable_uses: unclear
  general_purpose_models: unclear
  enforcement: unclear
  recipient: unclear
  cross_border: unclear
  frontier_scope: unclear

lens_basis_en: >
  Incident reporting is yes because ANTARA reports the ministry's AI director saying that all
  incidents must be reported under the draft. The draft text is not public, and the article names
  no body that receives reports and says nothing on systems built abroad or on frontier models, so
  recipient, cross-border and frontier scope stay unclear.
lens_basis_id: >
  Pelaporan insiden bernilai ya karena ANTARA memberitakan direktur AI di kementerian menyatakan
  semua insiden wajib dilaporkan menurut rancangan. Naskah rancangannya belum terbuka, dan berita
  itu tidak menyebut badan penerima laporan serta tidak membahas sistem buatan luar negeri atau
  model AI garda depan, jadi penerima, lintas batas, dan cakupan AI garda depan tetap belum jelas.
lens_checked: 2026-10-26

last_checked: 2026-10-26

eu_comparison: >
  The EU AI Act's serious incident reporting duty sits mainly on providers of high-risk systems
  and of general-purpose models with systemic risk. Indonesia's draft, as described, asks for
  reports of all incidents.

my_take: >
  This is the most interesting decision in the whole draft, and almost nobody outside Indonesia
  has noticed it. Incident reporting is one of the few tools governments have to learn about AI
  failures before they become disasters, and broad reporting gives regulators far more signal than
  a high-risk-only regime. The open question is capacity: who reads these reports, and what happens
  after one is filed? That is what I will watch once the rule is signed.

