last_checked: 2026-10-22

eu_comparison: >
  The EU AI Act's serious incident reporting duty sits mainly on providers of high-risk systems
  and of general-purpose models with systemic risk. Indonesia's draft, as described, asks for
  reports of all incidents.

my_take: >
  This is the most interesting decision in the whole draft, and almost nobody outside Indonesia
  has noticed it. Incident reporting is one of the few tools governments have to learn about AI
  failures before they become disasters, and broad reporting gives regulators far more signal than
  a high-risk-only regime. The open question is capacity: who reads these reports, and what happens
  after one is filed? That is what I will watch once the rule is signed.

