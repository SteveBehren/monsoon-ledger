title_en: A 72-hour breach clock, and nobody to call
title_id: Wajib lapor 72 jam, tetapi lembaganya belum ada

summary_en: >
  Government Regulation 33/2026, signed on 16 July 2026, sets out how Indonesia's 2022 personal
  data law works in practice. From 16 January 2027, organisations must notify affected people and
  the supervisory authority within 72 hours of confirming a breach, and the authority can fine up
  to 2% of annual gross revenue. But that authority has not been created. The presidential
  regulation needed to set it up has not been issued, and on 27 July 2026 the ministry opposed a
  court petition asking for a deadline.

ringkasan_id: >
  Peraturan Pemerintah 33/2026, yang ditandatangani pada 16 Juli 2026, mengatur pelaksanaan UU
  Pelindungan Data Pribadi tahun 2022. Mulai 16 Januari 2027, organisasi wajib memberi tahu pemilik
  data dan lembaga pengawas dalam 72 jam setelah memastikan terjadi kebocoran, dan lembaga itu
  dapat menjatuhkan denda hingga 2% dari pendapatan kotor tahunan. Namun lembaga pengawas itu
  belum dibentuk. Peraturan Presiden yang diperlukan belum terbit, dan pada 27 Juli 2026
  kementerian menolak permohonan ke pengadilan yang meminta tenggat waktu.

