eu_comparison: >
  The GDPR also gives 72 hours to notify the supervisory authority, and allows fines of up to 4%
  of worldwide annual turnover or 20 million euros for the most serious infringements. Indonesia's
  cap is 2% of annual gross revenue, and its supervisory authority does not exist yet.

my_take: >
  This one is not about AI directly, and I am including it on purpose. AI rules lean on the same
  machinery as data protection: someone has to receive the incident report, and someone has to be
  able to say no. The 72-hour clock matches the GDPR deadline for notifying the supervisory
  authority, so on paper Indonesia is at the European standard. But a deadline only matters if
  there is an authority at the other end, and in the August and September 2026 reports I found
  there is none. That makes 16 January 2027 the date to watch. I have only read legal summaries so
  far, not the regulation text, so I will read the primary text before treating the details as
  final.

