title_en: The AI rules that keep almost arriving
title_id: Aturan AI yang tak kunjung terbit

summary_en: >
  Indonesia has two draft presidential regulations on AI, a national roadmap and an ethics rule.
  Officials have announced a finish line at least five times since January 2025, and both are
  still drafts.

ringkasan_id: >
  Indonesia punya dua rancangan Peraturan Presiden tentang AI, yaitu peta jalan nasional dan
  aturan etika. Sejak Januari 2025, pejabat sudah setidaknya lima kali mengumumkan target selesai,
  tetapi keduanya masih berstatus rancangan.

safety_lens:
  incident_reporting: unclear
  unacceptable_uses: unclear
  general_purpose_models: unclear
  enforcement: none

last_checked: 2026-10-22

eu_comparison: >
  The EU AI Act is binding law with phased application dates. Indonesia's only AI-specific
  instrument in force is a 2023 circular letter that is not legally binding.

my_take: >
  I am not writing this to mock the ministry. Drafting AI rules for 280 million people across
  dozens of ministries is slow everywhere. But the gap matters: officials keep describing a task
  force, risk tiers and incident reporting as if they exist, while the only AI-specific instrument
  in force is a 2023 circular letter that is not legally binding. Anyone reading Indonesian AI
  governance from abroad should know which parts are real today and which are still promises.

