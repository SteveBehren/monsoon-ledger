# Instruments referenced by entries. Each entry's "instrument" must match an id here.
# binding: true means the instrument is (or would be, once signed) legally binding.

- id: se-menkominfo-9-2023
  name_en: Ministerial Circular Letter 9/2023 on AI ethics
  name_id: Surat Edaran Menkominfo 9/2023 tentang etika kecerdasan artifisial
  issued: 2023-12-19
  type: circular-letter
  status: in-force
  binding: false
  note_en: The only AI-specific instrument in force in Indonesia. It is guidance, not law.
  note_id: Satu-satunya instrumen khusus AI yang berlaku di Indonesia. Isinya panduan, bukan aturan yang mengikat.
  source_url: https://inet.detik.com/law-and-policy/d-7103666/kominfo-terbitkan-surat-edaran-etika-penggunaan-ai-di-indonesia
  archive_url: https://web.archive.org/web/20231222091457/https://inet.detik.com/law-and-policy/d-7103666/kominfo-terbitkan-surat-edaran-etika-penggunaan-ai-di-indonesia
  archived_at: 2023-12-22
  issuer_en: Minister of Communication and Informatics (Kominfo, now Komdigi)
  issuer_id: Menteri Komunikasi dan Informatika (Kominfo, kini Komdigi)
  level_en: Circular letter. Outside the hierarchy in Article 7(1) of Law 12/2011 and outside the ministerial regulations recognised in Article 8.
  level_id: Surat edaran. Di luar hierarki Pasal 7 ayat (1) UU 12/2011 dan di luar peraturan menteri yang diakui Pasal 8.
  read_in_full: true
  points_en:
    - Addressed to businesses that build AI and to public and private electronic system operators (PSE).
    - Organised in three parts, ethical values, how to apply them, and responsibility in using and developing AI.
    - Describes itself as ethical guidance. It creates no sanctions.
  points_id:
    - Ditujukan kepada pelaku usaha pemrograman berbasis AI serta penyelenggara sistem elektronik (PSE) publik dan privat.
    - Disusun dalam tiga bagian, yaitu nilai etika, pelaksanaan nilai etika, dan tanggung jawab dalam pemanfaatan dan pengembangan AI.
    - Menyebut dirinya pedoman etika. Tidak memuat sanksi.
  eu_en: No binding EU counterpart. In function it resembles soft-law codes such as the OECD AI Principles.
  eu_id: Tidak ada padanan mengikat di Uni Eropa. Fungsinya mirip kode hukum lunak seperti Prinsip AI OECD.
  refs: [se-9-2023, uu-12-2011, oecd]

- id: draft-perpres-ai-roadmap
  name_en: Draft Presidential Regulation on the National AI Roadmap 2026 to 2029
  name_id: Rancangan Perpres Peta Jalan Nasional AI 2026 sampai 2029
  type: presidential-regulation
  status: draft
  binding: true
  note_en: Unsigned as of 21 October 2026.
  note_id: Belum ditandatangani per 21 Oktober 2026.
  source_url: https://www.antaranews.com/berita/5802305/pemerintah-siapkan-gugus-tugas-kawal-implementasi-regulasi-ai
  archive_url: https://web.archive.org/web/20261026011000/https://www.antaranews.com/berita/5802305/pemerintah-siapkan-gugus-tugas-kawal-implementasi-regulasi-ai
  archived_at: 2026-10-26
  issuer_en: President of the Republic of Indonesia, drafted by Komdigi
  issuer_id: Presiden Republik Indonesia, disusun oleh Komdigi
  level_en: Presidential regulation, Article 7(1)(e) of Law 12/2011. Binding once signed and promulgated.
  level_id: Peraturan Presiden, Pasal 7 ayat (1) huruf e UU 12/2011. Mengikat setelah ditandatangani dan diundangkan.
  read_in_full: false
  points_en:
    - Draft text not published. What is known comes from official statements.
    - Officials say a task force will oversee implementation once the President signs.
  points_id:
    - Naskah rancangan belum dipublikasikan. Yang diketahui berasal dari pernyataan resmi.
    - Pejabat menyebut gugus tugas akan mengawal pelaksanaannya setelah Presiden menandatangani.
  eu_en: No direct counterpart. The AI Act is a regulation with duties, not a national roadmap.
  eu_id: Tidak ada padanan langsung. AI Act adalah regulasi yang memuat kewajiban, bukan peta jalan nasional.
  refs: [uu-12-2011, ai-act]

- id: draft-perpres-ai-ethics
  name_en: Draft Presidential Regulation on AI Ethics
  name_id: Rancangan Perpres Etika AI
  type: presidential-regulation
  status: draft
  binding: true
  note_en: Unsigned as of 21 October 2026. Draft text has not been published.
  note_id: Belum ditandatangani per 21 Oktober 2026. Naskah rancangan belum dipublikasikan.
  source_url: https://www.antaranews.com/berita/5802433/kemkomdigi-terapkan-pendekatan-berbasis-risiko-dalam-aturan-etika-ai
  issuer_en: President of the Republic of Indonesia, drafted by Komdigi
  issuer_id: Presiden Republik Indonesia, disusun oleh Komdigi
  level_en: Presidential regulation, Article 7(1)(e) of Law 12/2011. Binding once signed and promulgated.
  level_id: Peraturan Presiden, Pasal 7 ayat (1) huruf e UU 12/2011. Mengikat setelah ditandatangani dan diundangkan.
  read_in_full: false
  points_en:
    - Draft text not published. What is known comes from official statements.
    - Described as risk-based, with three tiers, low, high and unacceptable risk.
    - Described as carrying no criminal sanctions, relying on self-assessment, and requiring incident reporting channels.
  points_id:
    - Naskah rancangan belum dipublikasikan. Yang diketahui berasal dari pernyataan resmi.
    - Disebut berbasis risiko, dengan tiga tingkat, yaitu risiko rendah, tinggi, dan tidak dapat diterima.
    - Disebut tanpa sanksi pidana, mengandalkan penilaian mandiri, dan mewajibkan kanal pelaporan insiden.
  eu_en: The AI Act sets binding prohibitions (Article 5), high-risk duties (Article 6 and Annex III), transparency duties (Article 50), serious incident reporting (Article 73) and fines (Article 99).
  eu_id: AI Act memuat larangan yang mengikat (Pasal 5), kewajiban risiko tinggi (Pasal 6 dan Lampiran III), kewajiban transparansi (Pasal 50), pelaporan insiden serius (Pasal 73), dan denda (Pasal 99).
  refs: [uu-12-2011, ai-act, omnibus]

- id: asean-genai-guide-2025
  name_en: Expanded ASEAN Guide on AI Governance and Ethics, Generative AI
  name_id: Panduan ASEAN yang Diperluas tentang Tata Kelola dan Etika AI, AI Generatif
  issued: 2025-01
  type: regional-guidance
  status: in-force
  binding: false
  note_en: Regional guidance, not binding on member states.
  note_id: Panduan regional, tidak mengikat negara anggota.
  source_url: https://asean.org/wp-content/uploads/2025/01/Expanded-ASEAN-Guide-on-AI-Governance-and-Ethics-Generative-AI.pdf
  archive_url: https://web.archive.org/web/20260930003935/https://asean.org/wp-content/uploads/2025/01/Expanded-ASEAN-Guide-on-AI-Governance-and-Ethics-Generative-AI.pdf
  archived_at: 2026-09-30
  issuer_en: ASEAN Digital Ministers
  issuer_id: Para Menteri Digital ASEAN
  level_en: Regional guidance. Not part of Indonesian law and not binding on member states.
  level_id: Panduan regional. Bukan bagian dari hukum Indonesia dan tidak mengikat negara anggota.
  read_in_full: false
  points_en:
    - Expands the ASEAN Guide on AI Governance and Ethics, adopted on 2 February 2024, to cover generative AI.
    - The 2024 guide sets seven guiding principles, including transparency, fairness, security and safety, and accountability.
  points_id:
    - Memperluas ASEAN Guide on AI Governance and Ethics yang diadopsi 2 Februari 2024 agar mencakup AI generatif.
    - Panduan 2024 memuat tujuh prinsip, antara lain transparansi, keadilan, keamanan dan keselamatan, serta akuntabilitas.
  eu_en: Comparable in status to EU guidance documents rather than to the AI Act itself.
  eu_id: Setara dengan dokumen panduan, bukan dengan AI Act itu sendiri.
  refs: [asean-2024, asean-2025]

