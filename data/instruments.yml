- id: uu-pdp-27-2022
  name_en: Personal Data Protection Law (Law 27/2022)
  name_id: Undang-Undang Pelindungan Data Pribadi (UU 27/2022)
  issued: 2022
  type: law
  status: in-force
  binding: true
  note_en: The enforcing authority had still not been established as of the August 2026 report.
  note_id: Lembaga pengawas belum dibentuk per laporan Agustus 2026.
  source_url: https://www.hlc.com/en/publications/awaiting-indonesias-personal-data-protection-authority-a-constitutional-push-for-a-hard-deadline
  archive_url: https://web.archive.org/web/20260831105541/https://www.hlc.com/en/publications/awaiting-indonesias-personal-data-protection-authority-a-constitutional-push-for-a-hard-deadline
  archived_at: 2026-08-31
  issuer_en: House of Representatives (DPR) and the President
  issuer_id: Dewan Perwakilan Rakyat dan Presiden
  level_en: Law, Article 7(1)(c) of Law 12/2011. Binding.
  level_id: Undang-Undang, Pasal 7 ayat (1) huruf c UU 12/2011. Mengikat.
  read_in_full: true
  points_en:
    - Article 46 requires written notice of a personal data protection failure within 3 x 24 hours, to the data subject and to the agency.
    - Article 58 provides for an agency that is set up by, and answerable to, the President.
    - The two-year adjustment period ended in October 2024. The agency had not been formed by that deadline.
  points_id:
    - Pasal 46 mewajibkan pemberitahuan tertulis atas kegagalan pelindungan data pribadi paling lambat 3 x 24 jam, kepada subjek data dan kepada lembaga.
    - Pasal 58 mengatur lembaga yang ditetapkan oleh, dan bertanggung jawab kepada, Presiden.
    - Masa penyesuaian dua tahun berakhir Oktober 2024. Lembaga itu belum terbentuk saat tenggat tersebut.
  eu_en: GDPR Article 33 requires breach notice to the supervisory authority within 72 hours. GDPR Article 51 requires independent supervisory authorities.
  eu_id: Pasal 33 GDPR mewajibkan pemberitahuan kebocoran kepada otoritas pengawas dalam 72 jam. Pasal 51 GDPR mewajibkan otoritas pengawas yang independen.
  refs: [uu-pdp, uu-pdp-46, pdp-deadline, gdpr]

- id: gr-33-2026
  name_en: Government Regulation 33/2026 implementing the PDP Law
  name_id: Peraturan Pemerintah 33/2026 pelaksana UU Pelindungan Data Pribadi
  issued: 2026-07-16
  type: government-regulation
  status: signed
  binding: true
  note_en: Signed 16 July 2026. Takes effect on 16 January 2027.
  note_id: Ditandatangani 16 Juli 2026. Berlaku mulai 16 Januari 2027.
  source_url: https://www.nusantaradfdl.com/insights/indonesia-personal-data-protection-law-gr-33-2026/
  archive_url: https://web.archive.org/web/20261003170307/https://www.nusantaradfdl.com/insights/indonesia-personal-data-protection-law-gr-33-2026/
  archived_at: 2026-10-03
  issuer_en: President of the Republic of Indonesia
  issuer_id: Presiden Republik Indonesia
  level_en: Government regulation, Article 7(1)(d) of Law 12/2011. Binding once in effect.
  level_id: Peraturan Pemerintah, Pasal 7 ayat (1) huruf d UU 12/2011. Mengikat setelah berlaku.
  read_in_full: false
  points_en:
    - Implements the Personal Data Protection Law. Signed on 16 July 2026, in effect from 16 January 2027.
    - Known so far from law firm summaries. The text has not yet been read for this ledger.
  points_id:
    - Peraturan pelaksana UU Pelindungan Data Pribadi. Ditandatangani 16 Juli 2026, berlaku mulai 16 Januari 2027.
    - Sejauh ini diketahui dari ringkasan firma hukum. Naskahnya belum dibaca untuk catatan ini.
  eu_en: The GDPR is directly applicable and needs no implementing regulation in this sense.
  eu_id: GDPR berlaku langsung dan tidak memerlukan peraturan pelaksana dalam pengertian ini.
  refs: [uu-12-2011, gdpr]
